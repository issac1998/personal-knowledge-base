<main><div class="crumb">medical-records/source-notes/2026-11-04.html</div><h1 id="section">2026-11-04 已读门诊病历</h1>

<p>杭州市余杭区五常街道社区卫生服务中心，全科门诊。主诉“右手韧带术后 5 天换药”。诊断“手术后恢复期”。现病史否认发热、干咳、乏力等症状。体温 36.8°C，一般情况可。处理及建议栏显示“–”，未见具体换药操作内容。来源：浙里健康 e 生门诊病历。</p>
