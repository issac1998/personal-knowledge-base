<p>1月26日浙一余杭皮炎鼻炎，依巴斯汀10mgQD、莫米松0.1gBID，保湿避免烫洗抓挠刺激、规律睡眠等当时生活医嘱完整存就诊表。1月12日浙二鼻炎，药物有效未列名，鼻中隔左偏黏膜肿、中道嗅裂正常。1月5日两份皮肤科，一份丘疹性荨麻疹、四肢4丘疹，外用2周不佳；另份脱发1月加重，无具体药物或恢复记录。</p>
